# observability lib 크레이트 (U6). U0 SinkContracts 를 구현하는 push-only 관측 싱크 4종
# (StructuredLogger / StatusService / UploadHistoryStore / CriticalErrorNotifier) + no-op TrayIndicator.
[package]
name = "observability"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# 런타임 의존성은 전부 workspace 핀을 상속한다. R-PUSH-01: 유일한 내부 의존은 foundation(U0)뿐.
[dependencies]
foundation.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# proptest 는 optional: 오직 `proptest-support` feature 가 켜졌을 때만 빌드 그래프에 유입.
proptest = { workspace = true, optional = true }

# 자기 크레이트 테스트가 proptest-support feature 를 켤 수 있도록 dev-dependency 로도 재선언.
[dev-dependencies]
proptest.workspace = true

[features]
# NON-DEFAULT: default features 비어 있음 -> proptest 는 프로덕션 빌드 그래프에 유입되지 않음(PBT-07).
default = []
# U6 고유 타입 제너레이터 노출 + U0 proptest-support 재사용(재작성 금지).
proptest-support = ["dep:proptest", "foundation/proptest-support"]
