# foundation lib 크레이트 (U0). 순수 CoreTypes 값/함수/계약 트레이트 + ConfigProvider.
[package]
name = "foundation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# 런타임 의존성은 전부 workspace 핀을 상속한다.
[dependencies]
serde.workspace = true
ciborium.workspace = true
serde_json.workspace = true
url.workspace = true
thiserror.workspace = true
arc-swap.workspace = true
# proptest 는 optional: 오직 `proptest-support` feature 가 켜졌을 때만 빌드 그래프에 유입.
proptest = { workspace = true, optional = true }

# 자기 크레이트 테스트가 proptest-support feature 를 켤 수 있도록 dev-dependency 로도 재선언.
[dev-dependencies]
proptest.workspace = true

[features]
# NON-DEFAULT: default features 비어 있음 -> proptest 는 프로덕션 빌드 그래프에 유입되지 않음(MNT-02/PBT-07).
default = []
proptest-support = ["dep:proptest"]
