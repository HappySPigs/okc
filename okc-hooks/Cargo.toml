# okc-hooks 워크스페이스 루트 매니페스트.
# U0 `foundation` 크레이트가 의존성 DAG 의 루트이며, 하류 단위(U1..U8, watcher-bin)는
# 이후 웨이브에서 `members` 에 추가된다.
[workspace]
resolver = "2"
members = [
    "crates/foundation",
    "crates/content-core",
    "crates/change-detect",
    "crates/sync-state",
    "crates/auth-consent",
    "crates/observability",
    "crates/upload-client",
    "crates/lifecycle-deploy",
    "crates/ops-control",
    "crates/watcher-bin",
]

# 멤버 크레이트가 상속하는 공통 패키지 메타데이터.
# Edition 2024 + pinned MSRV 1.85 (Edition 2024 와 정합).
[workspace.package]
edition = "2024"
rust-version = "1.89"
version = "0.1.0"
license = "MIT OR Apache-2.0"

# 확정 크레이트 major/minor 시리즈 핀. 정확한 patch 핀 + MSRV CI 검증은 Build-and-Test 로 이연.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
serde_json = "1"
url = "2"
thiserror = "2"
arc-swap = "1"
proptest = "1"
# W2 웨이브 내부 크레이트가 상속하는 U0 라이브러리(경로 의존) + 유닛별 신규 외부 크레이트.
foundation = { path = "crates/foundation" }
sha2 = "0.10"   # U1 content-core: 스트리밍 SHA-256
notify = "6"    # U2 change-detect: 크로스플랫폼 파일시스템 감시
ureq = "3"      # U5 auth-consent: blocking rustls HTTPS 클라이언트
ctrlc = "3"     # U8 watcher-bin: SIGINT/SIGTERM을 graceful shutdown flag로 합류
# 완성된 W2 라이브러리 크레이트(경로 의존) — 하류 웨이브(W3 U3/U7a, W5 U8)가 소비한다.
content-core = { path = "crates/content-core" }
change-detect = { path = "crates/change-detect" }
sync-state = { path = "crates/sync-state" }
auth-consent = { path = "crates/auth-consent" }
observability = { path = "crates/observability" }
upload-client = { path = "crates/upload-client" }
lifecycle-deploy = { path = "crates/lifecycle-deploy" }
ops-control = { path = "crates/ops-control" }
watcher-bin = { path = "crates/watcher-bin" }
