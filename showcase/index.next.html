<!doctype html>
<html lang="ko" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OKC의 결정론적 컴파일, Hooks 동기화, MCP 안전 저작과 읽기 구조를 코드 수준에서 설명하는 기술 프레젠테이션" />
    <meta name="theme-color" content="#0b1730" />
    <meta property="og:title" content="OKC Technical Deep Dive" />
    <meta property="og:description" content="Deterministic core, resilient sync, safe agent I/O — 구현 메커니즘과 실패 조건을 상세히 설명합니다." />
    <meta property="og:image" content="assets/00-okc-hero.png" />
    <title>OKC Technical Deep Dive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['IBM Plex Sans KR', 'sans-serif'], mono: ['IBM Plex Mono', 'monospace'] },
            colors: { ink: '#0b1730', paper: '#f4f6fa', cobalt: '#3157d8', teal: '#087f72', amber: '#a96800' },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="technical.css" />
  </head>
  <body>
    <!--
      THESIS: OKC를 소개olf하는 대신 신뢰가 만들어지는 코드 경계와 실패 조건을 먼저 보여준다.
      OWN-WORLD: 밝은 검증 보고서 표면, 잉크 네이비 구조선, 코발트 데이터 흐름, teal/amber 상태 의미.
      STORY: 세 계약에서 시작해 Core, Web, Hooks, MCP의 불변식을 추적하고 실제 bridge 증거로 닫는다.
      FIRST VIEWPORT: 제품 문구보다 end-to-end 컴파일 경로가 가장 큰 요소로 보인다.
      FORM: 기존 쇼케이스 세계를 유지한 technical design review deck.
    -->
    <a class="skip-link" href="#deck">프레젠테이션 본문으로 건너뛰기</a>
    <div class="reading-progress" aria-hidden="true"><span id="progressBar"></span></div>
    <header class="deck-header" aria-label="프레젠테이션 도구">
      <a class="brand-mark" href="#slide-01" aria-label="첫 슬라이드로 이동">
        <span class="brand-symbol" aria-hidden="true">O</span>
        <span class="brand-copy"><strong>OKC</strong><small>TECHNICAL DEEP DIVE</small></span>
      </a>
      <div class="chapter-indicator" aria-live="polite"><span id="chapterName">SYSTEM MAP</span><strong id="currentTitle">OKC Technical Deep Dive</strong></div>
      <div class="header-actions">
        <button class="icon-button" id="outlineButton" type="button" aria-label="전체 슬라이드 목차 열기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg></button>
        <button class="icon-button" id="printButton" type="button" aria-label="PDF 또는 인쇄하기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V4h10v4M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v6H7z" /></svg></button>
        <button class="icon-button" id="fullscreenButton" type="button" aria-label="전체 화면으로 보기">
          <svg class="fullscreen-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" /></svg>
          <svg class="fullscreen-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5" /></svg>
        </button>
      </div>
    </header>
    <aside class="slide-rail" aria-label="슬라이드 바로가기"><div id="railItems"></div></aside>
    <main id="deck" class="deck" tabindex="-1">
      <!-- SLIDES -->
    </main>
    <nav class="deck-controls" aria-label="슬라이드 이동">
      <button id="previousButton" type="button" aria-label="이전 슬라이드"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></button>
      <span class="slide-count"><b id="currentSlide">01</b><i></i><span id="totalSlides">18</span></span>
      <button id="nextButton" type="button" aria-label="다음 슬라이드"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg></button>
    </nav>
    <div class="outline-panel" id="outlinePanel" role="dialog" aria-modal="true" aria-labelledby="outlineTitle" aria-hidden="true">
      <div class="outline-backdrop" data-close-dialog></div>
      <div class="outline-sheet">
        <div class="outline-header"><div><p>OKC TECHNICAL DECK</p><h2 id="outlineTitle">전체 슬라이드</h2></div><button class="icon-button icon-button--light" id="outlineClose" type="button" aria-label="목차 닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg></button></div>
        <ol id="outlineList" class="outline-list"></ol>
        <div class="outline-help"><span><kbd>←</kbd><kbd>→</kbd> 슬라이드 이동</span><span><kbd>M</kbd> 목차</span><span><kbd>F</kbd> 전체화면</span><span><kbd>Esc</kbd> 닫기</span></div>
      </div>
    </div>
    <div class="image-dialog" id="imageDialog" role="dialog" aria-modal="true" aria-labelledby="imageCaption" aria-hidden="true">
      <div class="image-dialog__backdrop" data-close-image></div>
      <div class="image-dialog__content"><button class="icon-button image-dialog__close" id="imageClose" type="button" aria-label="확대 이미지 닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg></button><img id="imagePreview" src="" alt="" /><p id="imageCaption"></p></div>
    </div>
    <noscript><div class="noscript-note">JavaScript가 꺼져 있어도 스크롤로 모든 슬라이드를 볼 수 있습니다.</div></noscript>
    <script src="script.js" defer></script>
  </body>
</html>
