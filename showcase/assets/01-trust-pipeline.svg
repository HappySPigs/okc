<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">OKC 신뢰 파이프라인</title>
  <desc id="desc">AI 제안, 코드 검증, 사람 승인, 결정론적 산출물의 네 단계를 보여준다. 중대한 비평 결과는 컴파일을 차단한다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A11"/>
      <stop offset="0.55" stop-color="#0C1120"/>
      <stop offset="1" stop-color="#090C14"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#3156FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3156FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172343"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="amberCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2115"/>
      <stop offset="1" stop-color="#15171F"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#112A27"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7189FF"/>
    </marker>
    <style>
      .sans { font-family: Inter, Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .eyebrow { fill: #8EA2FF; font-size: 19px; font-weight: 700; letter-spacing: 3px; }
      .title { fill: #F7F9FF; font-size: 54px; font-weight: 760; letter-spacing: -1.8px; }
      .subtitle { fill: #AAB2C5; font-size: 23px; font-weight: 450; }
      .stage { fill: #8792AA; font-size: 17px; font-weight: 700; letter-spacing: 2px; }
      .card-title { fill: #F8FAFF; font-size: 31px; font-weight: 730; letter-spacing: -0.7px; }
      .card-sub { fill: #AAB2C5; font-size: 19px; }
      .bullet { fill: #D9DEEA; font-size: 19px; }
      .lane { fill: #7F8AA1; font-size: 16px; font-weight: 650; letter-spacing: 1.5px; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <circle cx="1510" cy="88" r="180" fill="#2DD4BF" opacity="0.035"/>
  <circle cx="72" cy="820" r="210" fill="#F6B94B" opacity="0.035"/>

  <text x="74" y="78" class="sans eyebrow">OKC TRUST MODEL · CONCEPT</text>
  <text x="74" y="145" class="sans title">AI가 합친 지식을 믿는 방법</text>
  <text x="74" y="190" class="sans subtitle">AI는 제안하고, 코드는 검증하며, 사람만 승인합니다.</text>

  <path d="M 402 440 L 432 440" stroke="#7189FF" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 772 440 L 802 440" stroke="#7189FF" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1142 440 L 1172 440" stroke="#7189FF" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="250" width="330" height="390" rx="26" fill="#111722" stroke="#293249" stroke-width="2"/>
    <rect x="90" y="274" width="56" height="34" rx="17" fill="#1D2740"/>
    <text x="108" y="298" class="sans stage" fill="#9AA9E8">01</text>
    <text x="94" y="348" class="sans stage">AI PROPOSAL</text>
    <text x="94" y="394" class="sans card-title">정리와 합성</text>
    <text x="94" y="430" class="sans card-sub">가능성을 제안합니다</text>
    <circle cx="100" cy="494" r="4" fill="#7189FF"/>
    <text x="116" y="501" class="sans bullet">Taxonomy</text>
    <circle cx="100" cy="543" r="4" fill="#7189FF"/>
    <text x="116" y="550" class="sans bullet">Synthesis</text>
    <circle cx="100" cy="592" r="4" fill="#7189FF"/>
    <text x="116" y="599" class="sans bullet">Independent critic</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="440" y="250" width="330" height="390" rx="26" fill="url(#blueCard)" stroke="#536DFF" stroke-width="2"/>
    <rect x="460" y="274" width="56" height="34" rx="17" fill="#29408A"/>
    <text x="478" y="298" class="sans stage" fill="#DCE3FF">02</text>
    <text x="464" y="348" class="sans stage" fill="#A8B7FF">CODE VERIFICATION</text>
    <text x="464" y="394" class="sans card-title">근거를 검사</text>
    <text x="464" y="430" class="sans card-sub">제안을 데이터로 다룹니다</text>
    <circle cx="470" cy="494" r="4" fill="#8EA2FF"/>
    <text x="486" y="501" class="sans bullet">모든 블록 처리</text>
    <circle cx="470" cy="543" r="4" fill="#8EA2FF"/>
    <text x="486" y="550" class="sans bullet">Evidence hash 대조</text>
    <circle cx="470" cy="592" r="4" fill="#FF7B8A"/>
    <text x="486" y="599" class="sans bullet">Major · Critical 차단</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="810" y="250" width="330" height="390" rx="26" fill="url(#amberCard)" stroke="#B9852F" stroke-width="2"/>
    <rect x="830" y="274" width="56" height="34" rx="17" fill="#6C4B1C"/>
    <text x="848" y="298" class="sans stage" fill="#FFE3A8">03</text>
    <text x="834" y="348" class="sans stage" fill="#E7B85C">HUMAN APPROVAL</text>
    <text x="834" y="394" class="sans card-title">사람이 결정</text>
    <text x="834" y="430" class="sans card-sub">명시적으로 검토합니다</text>
    <circle cx="840" cy="494" r="4" fill="#E7B85C"/>
    <text x="856" y="501" class="sans bullet">Curator review</text>
    <circle cx="840" cy="543" r="4" fill="#E7B85C"/>
    <text x="856" y="550" class="sans bullet">Hash-bound approval</text>
    <circle cx="840" cy="592" r="4" fill="#E7B85C"/>
    <text x="856" y="599" class="sans bullet">수정 시 승인 무효화</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1180" y="250" width="340" height="390" rx="26" fill="url(#greenCard)" stroke="#2CB59F" stroke-width="2"/>
    <rect x="1200" y="274" width="56" height="34" rx="17" fill="#155E56"/>
    <text x="1218" y="298" class="sans stage" fill="#C4FFF3">04</text>
    <text x="1204" y="348" class="sans stage" fill="#63D8C5">DETERMINISTIC OUTPUT</text>
    <text x="1204" y="394" class="sans card-title">다시 검증 가능</text>
    <text x="1204" y="430" class="sans card-sub">승인된 결과만 발행합니다</text>
    <circle cx="1210" cy="494" r="4" fill="#4ED6BF"/>
    <text x="1226" y="501" class="sans bullet">Provider-free compile</text>
    <circle cx="1210" cy="543" r="4" fill="#4ED6BF"/>
    <text x="1226" y="550" class="sans bullet">Byte-level verify</text>
    <circle cx="1210" cy="592" r="4" fill="#4ED6BF"/>
    <text x="1226" y="599" class="sans bullet">Provenance explain</text>
  </g>

  <path d="M 605 640 L 605 696" stroke="#FF667A" stroke-width="2" stroke-dasharray="7 7"/>
  <rect x="473" y="696" width="264" height="52" rx="26" fill="#2B131C" stroke="#7C2F40"/>
  <circle cx="506" cy="722" r="12" fill="#FF667A"/>
  <path d="M 500 716 L 512 728 M 512 716 L 500 728" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
  <text x="530" y="729" class="sans" fill="#FFB1BB" font-size="18" font-weight="700">COMPILE BLOCKED</text>
  <text x="760" y="730" class="sans" fill="#8F99AD" font-size="17">재생성 후 다시 검토</text>

  <line x1="70" y1="808" x2="400" y2="808" stroke="#394258" stroke-width="2"/>
  <text x="70" y="842" class="sans lane">PROVIDER-DEPENDENT</text>
  <line x1="440" y1="808" x2="1520" y2="808" stroke="#2A746A" stroke-width="2"/>
  <text x="440" y="842" class="sans lane" fill="#64CDBD">PROVIDER-FREE DECISION &amp; VERIFICATION PATH</text>
</svg>
