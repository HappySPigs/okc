<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">OKC 엔지니어링 검증 수치</title>
  <desc id="desc">Core, Hooks, MCP, Web 및 네 모듈 브리지의 최신 로컬 통과 테스트 수치를 보여준다.</desc>
  <defs>
    <linearGradient id="proofBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E17"/>
      <stop offset="1" stop-color="#11182A"/>
    </linearGradient>
    <linearGradient id="proofAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#536DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="proofShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .sans { font-family: Inter, Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .eyebrow3 { fill: #8EA2FF; font-size: 18px; font-weight: 750; letter-spacing: 3px; }
      .title3 { fill: #F7F9FF; font-size: 48px; font-weight: 780; letter-spacing: -1.5px; }
      .value { fill: #FFFFFF; font-size: 55px; font-weight: 800; letter-spacing: -1px; }
      .label { fill: #B1BACD; font-size: 18px; font-weight: 650; }
      .detail { fill: #79859E; font-size: 15px; }
    </style>
  </defs>
  <rect width="1600" height="720" fill="url(#proofBg)"/>
  <rect x="0" y="0" width="1600" height="7" fill="url(#proofAccent)"/>
  <circle cx="1420" cy="80" r="240" fill="#536DFF" opacity="0.06"/>
  <text x="80" y="84" class="sans eyebrow3">LOCAL VERIFICATION EVIDENCE · 2026-09-09</text>
  <text x="80" y="145" class="sans title3">핵심 경계마다 통과 증거를 남겼습니다</text>

  <g filter="url(#proofShadow)">
    <rect x="80" y="210" width="334" height="190" rx="24" fill="#141B2B" stroke="#27324A"/>
    <text x="110" y="283" class="sans value">130</text>
    <text x="110" y="326" class="sans label">Core Rust tests</text>
    <text x="110" y="362" class="sans detail">+ Python 12 · Node binding 13</text>
  </g>
  <g filter="url(#proofShadow)">
    <rect x="448" y="210" width="334" height="190" rx="24" fill="#141B2B" stroke="#27324A"/>
    <text x="478" y="283" class="sans value">250</text>
    <text x="478" y="326" class="sans label">Hooks tests</text>
    <text x="478" y="362" class="sans detail">retry · resume · crash safety</text>
  </g>
  <g filter="url(#proofShadow)">
    <rect x="816" y="210" width="334" height="190" rx="24" fill="#141B2B" stroke="#27324A"/>
    <text x="846" y="283" class="sans value">103</text>
    <text x="846" y="326" class="sans label">MCP tests</text>
    <text x="846" y="362" class="sans detail">real stdio client coverage</text>
  </g>
  <g filter="url(#proofShadow)">
    <rect x="1184" y="210" width="336" height="190" rx="24" fill="#141B2B" stroke="#27324A"/>
    <text x="1214" y="283" class="sans value">114 + 8</text>
    <text x="1214" y="326" class="sans label">Web backend + frontend</text>
    <text x="1214" y="362" class="sans detail">native core success path included</text>
  </g>

  <rect x="80" y="448" width="1440" height="150" rx="28" fill="#0F2530" stroke="#246C68"/>
  <circle cx="149" cy="523" r="35" fill="#2DD4BF" opacity="0.18"/>
  <path d="M 134 524 L 146 536 L 167 509" fill="none" stroke="#61E5D0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="215" y="510" class="sans" fill="#D9FFF8" font-size="22" font-weight="700">FOUR-MODULE BRIDGE · PASS</text>
  <text x="215" y="552" class="sans" fill="#9CC9C2" font-size="18">실제 MCP 프로세스 + Rust CBOR encoder + FastAPI + native core binding</text>
  <rect x="1293" y="495" width="167" height="56" rx="28" fill="#2DD4BF"/>
  <text x="1346" y="532" class="sans" fill="#08201C" font-size="21" font-weight="800">1 PASS</text>

  <text x="80" y="658" class="sans" fill="#77839A" font-size="16">각 수치는 서로 다른 모듈의 최신 로컬 실행 기록이며, 하나의 합산 테스트 스위트 수치가 아닙니다.</text>
</svg>
