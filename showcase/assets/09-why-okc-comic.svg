<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1148" viewBox="0 0 1536 1148" role="img" aria-labelledby="title desc">
  <title id="title">OKC가 필요한 이유를 설명하는 6컷 만화</title>
  <desc id="desc">각 팀의 유용한 노트가 서로 충돌하고, 단순 AI 요약이 모순과 출처를 잃게 만드는 문제를 보여준다. OKC가 AI 제안, 코드 검증, 사람 승인을 분리하고 중대한 오류를 차단한 뒤 검증 가능한 지식을 발행하는 과정을 여섯 장면으로 설명한다.</desc>
  <defs>
    <linearGradient id="footerBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070A11"/>
      <stop offset="0.55" stop-color="#11182A"/>
      <stop offset="1" stop-color="#08141A"/>
    </linearGradient>
    <linearGradient id="footerLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#536DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.78"/>
    </filter>
    <style>
      .sans { font-family: Inter, Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif; }
      .panelNumber { fill: #FFFFFF; font-size: 15px; font-weight: 820; }
      .panelCaption { fill: #FFFFFF; font-size: 19px; font-weight: 760; letter-spacing: -0.25px; }
      .bubble { fill: #192030; font-size: 17px; font-weight: 760; letter-spacing: -0.2px; }
      .footerTag { fill: #93A5FF; font-size: 14px; font-weight: 780; letter-spacing: 2.4px; }
      .footerTitle { fill: #FFFFFF; font-size: 29px; font-weight: 790; letter-spacing: -0.7px; }
      .pillText { fill: #B9C4D9; font-size: 12px; font-weight: 760; letter-spacing: 0.8px; }
    </style>
  </defs>

  <rect width="1536" height="1148" fill="#EEEDE9"/>
  <image href="09-why-okc-comic-art.png" x="0" y="0" width="1536" height="1024" preserveAspectRatio="xMidYMid meet"/>

  <g filter="url(#textShadow)">
    <rect x="10" y="9" width="495" height="65" fill="#07101E" fill-opacity="0.78"/>
    <circle cx="37" cy="41" r="17" fill="#D69431"/>
    <text x="37" y="47" class="sans panelNumber" text-anchor="middle">1</text>
    <text x="65" y="48" class="sans panelCaption">각 팀의 노트는 저마다 유용했습니다</text>

    <rect x="520" y="9" width="497" height="65" fill="#07101E" fill-opacity="0.78"/>
    <circle cx="547" cy="41" r="17" fill="#4F6EFF"/>
    <text x="547" y="47" class="sans panelNumber" text-anchor="middle">2</text>
    <text x="575" y="48" class="sans panelCaption">하지만 같은 질문에 답이 셋이라면?</text>

    <rect x="1030" y="9" width="497" height="65" fill="#07101E" fill-opacity="0.82"/>
    <circle cx="1057" cy="41" r="17" fill="#E24B60"/>
    <text x="1057" y="47" class="sans panelNumber" text-anchor="middle">3</text>
    <text x="1085" y="48" class="sans panelCaption" font-size="18">하나로 요약하자 모순과 출처가 사라졌습니다</text>

    <rect x="10" y="517" width="495" height="53" fill="#07101E" fill-opacity="0.82"/>
    <circle cx="37" cy="543" r="16" fill="#D69431"/>
    <text x="37" y="549" class="sans panelNumber" text-anchor="middle">4</text>
    <text x="64" y="550" class="sans panelCaption" font-size="18">OKC는 제안 · 검증 · 승인을 분리합니다</text>

    <rect x="520" y="517" width="497" height="53" fill="#07101E" fill-opacity="0.84"/>
    <circle cx="547" cy="543" r="16" fill="#E24B60"/>
    <text x="547" y="549" class="sans panelNumber" text-anchor="middle">5</text>
    <text x="574" y="550" class="sans panelCaption" font-size="18">중대한 오류가 남으면 컴파일을 멈춥니다</text>

    <rect x="1030" y="517" width="497" height="53" fill="#07101E" fill-opacity="0.82"/>
    <circle cx="1057" cy="543" r="16" fill="#18A98E"/>
    <text x="1057" y="549" class="sans panelNumber" text-anchor="middle">6</text>
    <text x="1084" y="550" class="sans panelCaption" font-size="18">같은 답과 그 근거를 함께 읽습니다</text>
  </g>

  <text x="589" y="144" class="sans bubble" text-anchor="middle">10월 15일!</text>
  <text x="715" y="146" class="sans bubble" text-anchor="middle">10월 29일!</text>
  <text x="848" y="143" class="sans bubble" text-anchor="middle">11월 5일!</text>

  <rect x="0" y="1024" width="1536" height="124" fill="url(#footerBg)"/>
  <rect x="0" y="1024" width="1536" height="5" fill="url(#footerLine)"/>
  <text x="38" y="1064" class="sans footerTag">WHY OKC?</text>
  <text x="38" y="1107" class="sans footerTitle">OKC — AI는 제안하고, 코드는 검증하고, 사람은 승인합니다.</text>

  <g>
    <rect x="1052" y="1062" width="94" height="34" rx="17" fill="#172039" stroke="#344B9B"/>
    <text x="1099" y="1084" class="sans pillText" text-anchor="middle">SOURCE</text>
    <rect x="1156" y="1062" width="82" height="34" rx="17" fill="#172039" stroke="#344B9B"/>
    <text x="1197" y="1084" class="sans pillText" text-anchor="middle">HASH</text>
    <rect x="1248" y="1062" width="112" height="34" rx="17" fill="#2A2115" stroke="#8E6327"/>
    <text x="1304" y="1084" class="sans pillText" text-anchor="middle">APPROVAL</text>
    <rect x="1370" y="1062" width="126" height="34" rx="17" fill="#102925" stroke="#277A6E"/>
    <text x="1433" y="1084" class="sans pillText" text-anchor="middle">REVISION</text>
  </g>
</svg>
