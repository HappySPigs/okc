name: validate
on:
  push:
    paths:
      - "okc-mcp/**"
      - ".github/workflows/mcp-ci.yml"
  pull_request:
    paths:
      - "okc-mcp/**"
      - ".github/workflows/mcp-ci.yml"
permissions:
  contents: read
defaults:
  run:
    working-directory: okc-mcp
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: okc-mcp/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
