# Backend CI — okc-web (FastAPI + real okc binding).
# Monorepo root workflow: a single checkout provides okc-web/ and okc-core/ side by side.

name: backend-ci

on:
  push:
    paths: ["okc-web/backend/**", "okc-core/**", "okc-hooks/**", "okc-mcp/**", "scripts/**", ".github/workflows/web-backend-ci.yml"]
  pull_request:
    paths: ["okc-web/backend/**", "okc-core/**", "okc-hooks/**", "okc-mcp/**", "scripts/**", ".github/workflows/web-backend-ci.yml"]
  workflow_dispatch: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: okc-web/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build + install the okc-compiler wheel (maturin/pyo3)
        working-directory: .
        run: |
          uv venv --python 3.12 okc-web/backend/.venv
          VIRTUAL_ENV=okc-web/backend/.venv uv pip install "maturin==1.15.0"
          okc-web/backend/.venv/bin/maturin build --release --locked \
            --manifest-path okc-core/bindings/python/Cargo.toml \
            -i okc-web/backend/.venv/bin/python --out okc-core/bindings/python/dist
          VIRTUAL_ENV=okc-web/backend/.venv uv pip install okc-core/bindings/python/dist/okc_compiler-0.3.0-*.whl

      - name: Install backend deps (locked)
        # The unpublished native wheel is built above and intentionally outside
        # the PyPI lock. Retain it and install the optional validation tools.
        run: VIRTUAL_ENV=.venv uv sync --frozen --extra dev --inexact

      - name: Lint (ruff)
        run: .venv/bin/python -m ruff check app tests

      - name: Type-check (mypy)
        run: .venv/bin/python -m mypy app tests

      - name: Test (pytest, real binding)
        run: .venv/bin/python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: okc-mcp/package-lock.json

      - name: Build actual MCP and hooks protocol fixture
        working-directory: .
        run: |
          npm --prefix okc-mcp ci
          npm --prefix okc-mcp run build
          cargo build --locked --manifest-path okc-hooks/Cargo.toml -p upload-client --example protocol-fixture

      - name: Four-module integration and current AI-DLC links
        working-directory: .
        run: |
          okc-web/backend/.venv/bin/python -m pytest -c okc-web/backend/pyproject.toml scripts/test_integration.py -q
          node scripts/verify-aidlc.mjs

      - name: Secret scan (no hardcoded secrets)
        run: |
          ! grep -rnEi "(api[_-]?key|secret|password)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9_-]{16,}['\"]" app \
            | grep -vE "env|getenv|environ|api_key_env|_ENV"
