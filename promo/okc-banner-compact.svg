<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 481 200" width="481" height="200" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif">
  <title>OKC — 검증된 지식만 믿는 AI (compact 481x200)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="481" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="0.5" stop-color="#10152a"/>
      <stop offset="1" stop-color="#080b15"/>
    </linearGradient>
    <radialGradient id="stageGlow" cx="350" cy="88" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#a855f7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="352" cy="82" r="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.40"/>
      <stop offset="0.6" stop-color="#a855f7" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="whiteGlow" cx="352" cy="82" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="352" cy="80" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f0abfc" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="crystalBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="beam" x1="430" y1="181" x2="360" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="spine" x1="22" y1="0" x2="452" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="vignette" cx="240" cy="100" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="beamb" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2"/></filter>
    <symbol id="gem" viewBox="0 0 60 70">
      <path d="M30 3 L54 20 L46 58 L30 67 L14 58 L6 20 Z" fill="url(#crystalBody)"/>
      <path d="M30 3 L30 67 L14 58 L6 20 Z" fill="#6366f1" opacity="0.45"/>
      <path d="M30 3 L54 20 L46 58 L30 67" fill="none" stroke="#f0abfc" stroke-width="1.2" opacity="0.6"/>
      <path d="M30 3 L14 58 M6 20 L54 20" stroke="#e9d5ff" stroke-width="0.8" opacity="0.4"/>
    </symbol>
    <symbol id="star" viewBox="0 0 24 24">
      <path d="M12 0 C13 8 16 11 24 12 C16 13 13 16 12 24 C11 16 8 13 0 12 C8 11 11 8 12 0Z" fill="#fde68a"/>
    </symbol>
  </defs>

  <!-- (1-2) background + right-biased stage glow -->
  <rect width="481" height="200" fill="url(#bg)"/>
  <rect width="481" height="200" fill="url(#stageGlow)"/>

  <!-- (3-5) crystal halo, white inner glow, orbit ring, rising beam -->
  <circle cx="352" cy="82" r="86" fill="url(#halo)"/>
  <circle cx="352" cy="82" r="30" fill="url(#whiteGlow)"/>
  <circle cx="352" cy="82" r="56" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.4"/>
  <path d="M430 181 Q404 152 360 124" fill="none" stroke="url(#beam)" stroke-width="3" opacity="0.4" stroke-linecap="round" filter="url(#beamb)"/>

  <!-- (6-8) crystal focal + white core + sparkles -->
  <use href="#gem" x="314" y="36" width="76" height="90"/>
  <circle cx="352" cy="80" r="11" fill="url(#core)"/>
  <use href="#star" x="342" y="18" width="13" height="13"/>
  <use href="#star" x="395" y="59" width="11" height="11"/>
  <use href="#star" x="307" y="111" width="10" height="10" opacity="0.9"/>

  <!-- (9-13) Codi mascot presenting the crystal -->
  <ellipse cx="247" cy="159" rx="26" ry="5" fill="#000000" opacity="0.28"/>
  <circle cx="216" cy="120" r="7" fill="#818cf8"/>
  <rect x="232" y="134" width="34" height="22" rx="11" fill="#6366f1"/>
  <rect x="220" y="88" width="54" height="46" rx="17" fill="#818cf8"/>
  <rect x="231" y="100" width="32" height="26" rx="13" fill="#0b1020"/>
  <circle cx="243" cy="116" r="5" fill="#34d399"/><circle cx="244.5" cy="114" r="1.8" fill="#eafff6"/>
  <circle cx="259" cy="116" r="5" fill="#34d399"/><circle cx="260.5" cy="114" r="1.8" fill="#eafff6"/>
  <ellipse cx="233" cy="123" rx="4" ry="3" fill="#f0abfc" opacity="0.5"/>
  <ellipse cx="269" cy="123" rx="4" ry="3" fill="#f0abfc" opacity="0.5"/>
  <line x1="247" y1="80" x2="247" y2="90" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round"/>
  <use href="#star" x="240" y="66" width="14" height="14"/>
  <line x1="270" y1="112" x2="298" y2="74" stroke="#818cf8" stroke-width="9" stroke-linecap="round"/>
  <circle cx="301" cy="70" r="8" fill="#818cf8"/>

  <!-- (14) verified sticker sealing the crystal -->
  <g transform="rotate(-7 399 58)">
    <rect x="350" y="44" width="98" height="28" rx="14" fill="#34d399" stroke="#10b981" stroke-width="1.5"/>
    <path d="M364 58 l5 6 l10 -12" stroke="#053b2b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="386" y="63" font-size="14" font-weight="800" fill="#053b2b">검증됨</text>
  </g>

  <!-- (15-17) bottom 5-module flow spine (label-less) -->
  <line x1="22" y1="183" x2="452" y2="183" stroke="url(#spine)" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <circle cx="60" cy="183" r="3" fill="#a855f7"/>
  <circle cx="150" cy="183" r="3" fill="#f59e0b"/>
  <circle cx="245" cy="183" r="3" fill="#6366f1"/>
  <circle cx="340" cy="183" r="3" fill="#34d399"/>
  <circle cx="430" cy="183" r="3.4" fill="#34d399"/>
  <path d="M452 179 l9 4 l-9 4 z" fill="#34d399"/>

  <!-- (18) wordmark -->
  <use href="#gem" x="18" y="14" width="22" height="27"/>
  <text x="46" y="36" font-size="22" font-weight="800" fill="#eef2fb" letter-spacing="1">OKC</text>

  <!-- (19-20) headline -->
  <ellipse cx="120" cy="110" rx="40" ry="22" fill="#6366f1" opacity="0.28" filter="url(#soft)"/>
  <text x="18" y="86" font-size="25" font-weight="800"><tspan fill="#34d399">검증된 </tspan><tspan fill="#eef2fb">지식만</tspan></text>
  <text x="18" y="118" font-size="25" font-weight="800"><tspan fill="#eef2fb">믿는 </tspan><tspan fill="#a5b4fc">AI</tspan></text>

  <!-- (21) trust chip -->
  <rect x="18" y="138" width="94" height="26" rx="13" fill="#10241b" stroke="#34d399" stroke-width="1.5"/>
  <path d="M30 151 l4 5 l9 -11" stroke="#34d399" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="49" y="156" font-size="13" font-weight="700" fill="#86efc9">검증됨</text>

  <!-- corner vignette to seat the glow -->
  <rect width="481" height="200" fill="url(#vignette)"/>
</svg>
