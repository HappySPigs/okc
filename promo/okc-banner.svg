<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif">
  <title>OKC — 검증된 지식만 믿는 AI</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="0.5" stop-color="#10152a"/>
      <stop offset="1" stop-color="#080b15"/>
    </linearGradient>
    <radialGradient id="stageGlow" cx="1240" cy="215" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#a855f7" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="1240" cy="210" r="185" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.40"/>
      <stop offset="0.6" stop-color="#a855f7" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7d2fe" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spine" x1="150" y1="0" x2="1300" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="seam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5b4fc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a5b4fc" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="crystalBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="soft6" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
    <symbol id="gem" viewBox="0 0 60 70">
      <path d="M30 3 L54 20 L46 58 L30 67 L14 58 L6 20 Z" fill="url(#crystalBody)"/>
      <path d="M30 3 L30 67 L14 58 L6 20 Z" fill="#7e22ce" opacity="0.55"/>
      <path d="M30 3 L54 20 L46 58 L30 67" fill="none" stroke="#f0abfc" stroke-width="1.1" opacity="0.55"/>
      <path d="M30 3 L14 58 M6 20 L54 20" stroke="#e9d5ff" stroke-width="0.7" opacity="0.4"/>
      <ellipse cx="27" cy="28" rx="6" ry="11" fill="#faf5ff" opacity="0.55"/>
    </symbol>
    <symbol id="star" viewBox="0 0 24 24">
      <path d="M12 0 C13 8 16 11 24 12 C16 13 13 16 12 24 C11 16 8 13 0 12 C8 11 11 8 12 0Z" fill="#fde68a"/>
    </symbol>
  </defs>

  <!-- (1) background -->
  <rect width="1600" height="500" fill="url(#bg)"/>
  <!-- (2) stage light + glow -->
  <polygon points="1240,-40 1080,472 1400,472" fill="url(#cone)" opacity="0.10"/>
  <rect width="1600" height="500" fill="url(#stageGlow)"/>
  <!-- faint constellation -->
  <g fill="#cbd5e1" opacity="0.06">
    <circle cx="140" cy="70" r="2"/><circle cx="300" cy="48" r="1.6"/><circle cx="470" cy="96" r="2.2"/>
    <circle cx="620" cy="60" r="1.5"/><circle cx="780" cy="110" r="2"/><circle cx="900" cy="52" r="1.6"/>
    <circle cx="1020" cy="120" r="1.8"/><circle cx="1120" cy="60" r="2"/><circle cx="1460" cy="70" r="2.2"/>
    <circle cx="1540" cy="150" r="1.6"/><circle cx="1380" cy="200" r="1.6"/><circle cx="70" cy="150" r="1.8"/>
    <circle cx="240" cy="170" r="1.4"/><circle cx="560" cy="180" r="1.5"/>
  </g>
  <!-- soft vertical seam separating typo/stage brightness -->
  <rect x="822" y="40" width="36" height="420" fill="url(#seam)" opacity="0.06"/>

  <!-- (3) crisis cluster (backmost, low saturation) -->
  <g opacity="0.5">
    <g transform="translate(1430,92) rotate(-8)">
      <rect x="0" y="0" width="72" height="50" rx="7" fill="#2a3757"/>
      <line x1="12" y1="16" x2="52" y2="16" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="12" y1="26" x2="44" y2="26" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="12" y1="36" x2="50" y2="36" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(1452,108) rotate(-8)" opacity="0.9">
      <rect x="0" y="0" width="72" height="50" rx="7" fill="#334155"/>
      <text x="52" y="38" font-size="30" font-weight="800" fill="#f43f5e" opacity="0.85">?</text>
    </g>
    <text x="1436" y="182" font-size="12.5" fill="#64748b">출처: 없음</text>
    <!-- tiny worried mini-Codi -->
    <g transform="translate(1520,150) scale(0.32)" opacity="0.85">
      <rect x="26" y="42" width="88" height="72" rx="27" fill="#64748b"/>
      <rect x="38" y="56" width="64" height="44" rx="16" fill="#0b1020"/>
      <path d="M50 76 l14 12 M64 76 l-14 12" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
      <path d="M74 76 l14 12 M88 76 l-14 12" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
      <path d="M116 62 q9 12 0 20 q-9 -8 0 -20Z" fill="#38bdf8"/>
    </g>
  </g>

  <!-- (4) provenance: source note cards + tracing curves to crystal base -->
  <g>
    <g stroke="#22d3ee" fill="#111a2e" stroke-width="1.4">
      <rect x="1396" y="336" width="52" height="40" rx="6" transform="rotate(-6 1422 356)"/>
      <rect x="1430" y="346" width="52" height="40" rx="6" transform="rotate(4 1456 366)"/>
      <rect x="1414" y="360" width="52" height="40" rx="6"/>
    </g>
    <g fill="none" stroke-width="1.6" opacity="0.75" stroke-linecap="round">
      <path d="M1418 352 Q1330 320 1248 294" stroke="#22d3ee"/>
      <path d="M1440 360 Q1350 336 1252 300" stroke="#34d399"/>
      <path d="M1428 388 Q1340 350 1246 302" stroke="#22d3ee" opacity="0.6"/>
    </g>
    <g fill="#34d399">
      <circle cx="1332" cy="312" r="3.2"/><circle cx="1338" cy="322" r="3"/><circle cx="1330" cy="342" r="2.8"/>
    </g>
  </g>

  <!-- (5) knowledge crystal (FOCAL) -->
  <circle cx="1240" cy="210" r="185" fill="url(#halo)"/>
  <g opacity="0.5" stroke="#c084fc" fill="none">
    <circle cx="1240" cy="210" r="118" stroke-width="1"/>
    <circle cx="1240" cy="210" r="140" stroke-width="0.7" opacity="0.6"/>
  </g>
  <use href="#gem" x="1167" y="123" width="146" height="171"/>
  <g>
    <use href="#star" x="1128" y="98" width="22" height="22"/>
    <use href="#star" x="1339" y="119" width="18" height="18"/>
    <use href="#star" x="1160" y="291" width="15" height="15" opacity="0.9"/>
    <use href="#star" x="1320" y="290" width="17" height="17"/>
    <use href="#star" x="1236" y="64" width="26" height="26"/>
  </g>
  <!-- (6) crystal "verified" sticker -->
  <g transform="translate(1300,146) rotate(-7)">
    <rect x="0" y="0" width="98" height="30" rx="15" fill="#34d399" stroke="#10b981" stroke-width="1.5"/>
    <path d="M14 15 l6 7 l11 -13" stroke="#053b2b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="38" y="20" font-size="14" font-weight="800" fill="#053b2b">검증됨</text>
  </g>

  <!-- (7) Codi mascot, presenting the crystal -->
  <g transform="translate(1006,206) scale(0.74)">
    <ellipse cx="70" cy="158" rx="30" ry="6" fill="#000" opacity="0.28"/>
    <!-- raised presenting arm toward crystal -->
    <line x1="100" y1="122" x2="126" y2="84" stroke="#818cf8" stroke-width="11" stroke-linecap="round"/>
    <circle cx="130" cy="79" r="10" fill="#818cf8"/>
    <line x1="70" y1="30" x2="70" y2="44" stroke="#a5b4fc" stroke-width="5" stroke-linecap="round"/>
    <use href="#star" x="60" y="10" width="20" height="20"/>
    <rect x="26" y="42" width="88" height="72" rx="27" fill="#818cf8"/>
    <rect x="38" y="56" width="64" height="44" rx="16" fill="#0b1020"/>
    <circle cx="58" cy="78" r="8" fill="#34d399"/><circle cx="61" cy="75" r="2.6" fill="#eafff6"/>
    <circle cx="82" cy="78" r="8" fill="#34d399"/><circle cx="85" cy="75" r="2.6" fill="#eafff6"/>
    <ellipse cx="44" cy="93" rx="6" ry="4" fill="#f0abfc" opacity="0.55"/>
    <ellipse cx="96" cy="93" rx="6" ry="4" fill="#f0abfc" opacity="0.55"/>
    <rect x="44" y="116" width="52" height="34" rx="15" fill="#6366f1"/>
    <circle cx="30" cy="126" r="9" fill="#818cf8"/>
    <!-- ✓ mini badge beside face -->
    <circle cx="120" cy="58" r="12" fill="#34d399"/>
    <path d="M114 58 l4 5 l7 -9" stroke="#053b2b" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- source-provenance tag (proof of tracing) -->
  <g>
    <rect x="1120" y="352" width="188" height="26" rx="13" fill="#0d2029" stroke="#22d3ee" stroke-width="1.2" opacity="0.95"/>
    <path d="M1136 365 a7 7 0 0 1 12 0 M1139 365 a4 4 0 0 1 6 0" fill="none" stroke="#22d3ee" stroke-width="1.3"/>
    <text x="1156" y="369" font-size="12.5" fill="#7fe6f7">출처: vault/note.md</text>
    <path d="M1286 365 l4 5 l7 -9" stroke="#34d399" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- (8) left typography zone -->
  <!-- wordmark -->
  <use href="#gem" x="62" y="30" width="42" height="49"/>
  <text x="116" y="62" font-size="30" font-weight="800" fill="#eef2fb" letter-spacing="1.5">OKC</text>
  <text x="118" y="86" font-size="11" fill="#9fb0cf" letter-spacing="2.6">OBSIDIAN KNOWLEDGE COMPILATION</text>
  <!-- headline -->
  <text x="64" y="176" font-size="58" font-weight="800" fill="#eef2fb">검증된 지식만</text>
  <ellipse cx="258" cy="220" rx="72" ry="40" fill="#6366f1" opacity="0.30" filter="url(#soft)"/>
  <text x="64" y="238" font-size="58" font-weight="800"><tspan fill="#eef2fb">믿는 </tspan><tspan fill="#a5b4fc">AI</tspan></text>
  <!-- subline -->
  <text x="66" y="288" font-size="21" fill="#9fb0cf">흩어진 볼트를 <tspan fill="#eef2fb" font-weight="700">사람이 검증한</tspan> 하나의 진실로.</text>
  <!-- tagline -->
  <rect x="64" y="312" width="4" height="48" rx="2" fill="#6366f1"/>
  <text x="84" y="332" font-size="17" fill="#c7d0e6">AI의 답은, 사람이 검증한 지식만큼만</text>
  <text x="84" y="356" font-size="17" fill="#c7d0e6">믿을 수 있다.</text>
  <!-- trust badges -->
  <g>
    <rect x="64" y="382" width="108" height="34" rx="17" fill="#10241b" stroke="#34d399" stroke-width="1.5"/>
    <path d="M82 399 l6 7 l12 -14" stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="108" y="404" font-size="15" font-weight="700" fill="#86efc9">검증됨</text>
  </g>
  <g>
    <rect x="182" y="382" width="120" height="34" rx="17" fill="#0d2029" stroke="#22d3ee" stroke-width="1.5"/>
    <path d="M198 401 a7 7 0 0 1 12 0 M201 401 a4 4 0 0 1 6 0" fill="none" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="218" y="404" font-size="15" font-weight="700" fill="#7fe6f7">출처 추적</text>
  </g>
  <g>
    <rect x="314" y="386" width="92" height="26" rx="13" fill="#141c30" stroke="#6366f1" stroke-width="1.2"/>
    <text x="360" y="403" text-anchor="middle" font-size="12.5" fill="#a5b4fc">사람 검증</text>
  </g>
  <g>
    <rect x="414" y="386" width="92" height="26" rx="13" fill="#141c30" stroke="#a855f7" stroke-width="1.2"/>
    <text x="460" y="403" text-anchor="middle" font-size="12.5" fill="#d8b4fe">결정론적</text>
  </g>

  <!-- (9) bottom 5-module flow spine -->
  <line x1="152" y1="455" x2="1292" y2="455" stroke="url(#spine)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M1292 449 l14 6 l-14 6 z" fill="#34d399"/>
  <g fill="#22d3ee" opacity="0.7"><circle cx="320" cy="455" r="2.4"/><circle cx="585" cy="455" r="2.4"/><circle cx="850" cy="455" r="2.4"/><circle cx="1115" cy="455" r="2.4"/></g>

  <!-- node: Obsidian -->
  <circle cx="185" cy="455" r="18" fill="#10152a" stroke="#a855f7" stroke-width="1.8"/>
  <g stroke="#c084fc" stroke-width="1.7" fill="none"><rect x="179" y="447" width="12" height="16" rx="2"/><line x1="182" y1="452" x2="188" y2="452"/><line x1="182" y1="456" x2="188" y2="456"/></g>
  <text x="185" y="491" text-anchor="middle" font-size="12.5" font-weight="700" fill="#cbb2f0">Obsidian</text>

  <!-- node: okc-hooks -->
  <circle cx="450" cy="455" r="18" fill="#10152a" stroke="#f59e0b" stroke-width="1.8"/>
  <path d="M442 448 H458 L452 457 V462 H448 V457 Z" fill="#fbbf24"/>
  <text x="450" y="491" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fcd689">okc-hooks</text>

  <!-- node: okc-core (emphasis) -->
  <circle cx="715" cy="455" r="22" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.35" filter="url(#soft6)"/>
  <circle cx="715" cy="455" r="20" fill="#10152a" stroke="#6366f1" stroke-width="2"/>
  <g stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"><line x1="715" y1="444" x2="715" y2="448"/><line x1="715" y1="462" x2="715" y2="466"/><line x1="704" y1="455" x2="708" y2="455"/><line x1="722" y1="455" x2="726" y2="455"/></g>
  <circle cx="715" cy="455" r="6.5" fill="none" stroke="#a5b4fc" stroke-width="2"/>
  <text x="715" y="493" text-anchor="middle" font-size="12.5" font-weight="800" fill="#c7d0ff">okc-core</text>

  <!-- node: okc-web (emphasis) -->
  <circle cx="980" cy="455" r="22" fill="none" stroke="#34d399" stroke-width="2" opacity="0.35" filter="url(#soft6)"/>
  <circle cx="980" cy="455" r="20" fill="#10152a" stroke="#34d399" stroke-width="2"/>
  <path d="M970 455 l5 6 l9 -12" stroke="#34d399" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g><rect x="985" y="452" width="9" height="8" rx="1.5" fill="#34d399"/><path d="M986.5 452 v-2 a2.8 2.8 0 0 1 5.5 0 v2" fill="none" stroke="#34d399" stroke-width="1.4"/></g>
  <text x="980" y="493" text-anchor="middle" font-size="12.5" font-weight="800" fill="#86efc9">okc-web</text>

  <!-- node: okc-mcp -->
  <circle cx="1245" cy="455" r="18" fill="#10152a" stroke="#22d3ee" stroke-width="1.8"/>
  <g fill="#22d3ee"><rect x="1239" y="450" width="10" height="9" rx="2"/></g>
  <g stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round"><line x1="1241" y1="450" x2="1241" y2="447"/><line x1="1247" y1="450" x2="1247" y2="447"/></g>
  <line x1="1251" y1="455" x2="1260" y2="455" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="1245" y="491" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7fe6f7">okc-mcp</text>
</svg>
