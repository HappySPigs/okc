[project]
name = "okc-web-backend"
version = "0.1.0"
description = "okc-web control-plane & serving backend (FastAPI) over the okc-core engine via the okc Python bindings (ADR-0002 / ADR-0025)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "argon2-cffi>=23.1",
    "python-ulid>=2.2",
    "python-multipart>=0.0.9",
    # Engine seam (ADR-0002): the okc Python binding. Local, unpublished 0.3.0
    # package — built with maturin from okc-core/bindings/python and installed as
    # a wheel (see README). Not resolvable from PyPI, so it is declared as an
    # optional group to keep `uv sync` usable in rust-less environments; the
    # server and integration tests require it to be installed.
]

[project.optional-dependencies]
# NOTE: the engine seam `okc-compiler` (0.3.0) is a local, unpublished maturin/pyo3
# wheel built from okc-core/bindings/python — NOT resolvable from PyPI. It is
# installed out-of-band (see README / CI: `maturin build` then `uv pip install`
# the wheel), so it is intentionally NOT a locked dependency here; the lockfile
# pins only the reproducible PyPI deps. The server + integration tests require it.
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()-in-defaults is idiomatic. UP042: (str, Enum) is a
# deliberate choice for clean JSON/wire serialization across the app.
ignore = ["E501", "B008", "UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
